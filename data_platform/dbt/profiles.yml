# Local warehouse from data_platform/infra/docker-compose.yml. Override with env vars elsewhere (a scheduler, RDS).
receipts:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PORT', '5433') | int }}"
      user: "{{ env_var('DBT_USER', 'pipeline') }}"
      password: "{{ env_var('DBT_PASSWORD', 'pipeline') }}"
      dbname: "{{ env_var('DBT_DBNAME', 'warehouse') }}"
      schema: public
      threads: 4
